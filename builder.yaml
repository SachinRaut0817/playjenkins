apiVersion: v1
kind: Pod
metadata:
  name: kaniko
spec:
  securityContext:
  #  runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers: 
  - name: kaniko
    image: gcr.io/kaniko-project/executor:debug
    securityContext:
 #     runAsNonRoot: true
 #     runAsUser: 1000
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
      seccompProfile:
        type: RuntimeDefault
    command:
      - /busybox/cat
    tty: true
    volumeMounts:
      - name: kaniko-secret
        mountPath: /kaniko/.docker
  - name: jnlp
    image: 671438781287.dkr.ecr.ap-southeast-1.amazonaws.com/dockerhub/jenkins/inbound-agent:3248.v65ecb_254c298-6
    securityContext:
#      runAsNonRoot: true
#      runAsUser: 1000
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
      seccompProfile:
        type: RuntimeDefault
  volumes:
    - name: kaniko-secret
      secret:
        secretName: regcred
        items:
          - key: .dockerconfigjson
            path: config.json
