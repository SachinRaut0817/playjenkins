apiVersion: v1
kind: Pod
metadata:
  name: kaniko
spec:
  initContainers:
    - name: init-permissions
      image: busybox
      command: ["sh", "-c", "sleep 30 && chmod -R 777 /kaniko"]
      volumeMounts:
        - name: kaniko-secret
          mountPath: /kaniko/.docker
  containers: 
    - name: kaniko
      image: gcr.io/kaniko-project/executor:debug
      command:
        - /busybox/cat
      tty: true
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      volumeMounts:
        - name: kaniko-secret
          mountPath: /kaniko/.docker
    - name: jnlp
      image: 671438781287.dkr.ecr.ap-southeast-1.amazonaws.com/dockerhub/jenkins/inbound-agent:3248.v65ecb_254c298-6
  volumes:
    - name: kaniko-secret
      secret:
        secretName: regcred
        items:
          - key: .dockerconfigjson
            path: config.json
